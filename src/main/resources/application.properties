front.path=https://kky.tail0a6d17.ts.net/ploud

#JWT
jwt.secret="${JWT_SECRET}

#encryptor
encrypt.secret="${ENCRYPT_SECRET}"


logging.level.root=INFO
logging.level.HTTP_ACCESS=INFO
