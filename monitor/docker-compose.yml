services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ploud-prometheus
    volumes:
      - /home/kky/ploud/monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/kky/ploud/monitor/prometheus/data:/prometheus
    ports:
      - "9210:9090"
    restart: unless-stopped
    networks:
      - monitor

  grafana:
    image: grafana/grafana:latest
    container_name: ploud-grafana
    volumes:
      - /home/kky/ploud/monitor/grafana/data:/var/lib/grafana
    ports:
      - "3010:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ploud-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "9220:8080"
    networks:
      - monitor
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    container_name: ploud-loki
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitor
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: ploud-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro #***
    depends_on:
      - loki
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - monitor
    restart: unless-stopped


networks:
  monitor:
    external: true
    name: monitor
volumes:
  alloy-data:
